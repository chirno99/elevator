# 画角・人数カウントライン（基準解像度に対する比率 0.0〜1.0）
# 2026-10-23 実写合わせ：青枠＝黒い階表示。赤線＝人数検知ライン

reference_width: 640
reference_height: 480

# 階表示（黒いディスプレイがこの枠の中に入る画角）
left_display:
  x1: 0.2125
  y1: 0.1208
  x2: 0.3484
  y2: 0.4604
right_display:
  x1: 0.7813
  y1: 0.1375
  x2: 0.9203
  y2: 0.4188

# 人数検知ライン（実写の赤線。右に向かってわずかに上がる）
count_line:
  x1: 0.3500
  y1: 0.6817
  x2: 0.7734
  y2: 0.6435

# 車内から扉を見ている前提。扉側からカメラ側（手前）へ跨ぐと乗車。
# 明日の検証で IN/OUT が逆なら toward_door にする。
enter_direction: toward_camera
